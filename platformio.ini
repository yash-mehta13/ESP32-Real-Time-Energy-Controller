; Build environments
;   esp32dev_sim   (default) deterministic simulated measurements. The relay
;                  GPIO is held at its OFF level; simulated power can never
;                  close a real relay.
;   esp32dev_pzem  real PZEM-004T v3.0 measurements and a real relay output.
;                  Only build/flash this after reading docs/safety-and-limitations.md.
;
; Host-side unit tests are not a PlatformIO environment: run `make test`.

[platformio]
default_envs = esp32dev_sim

[env]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    blynkkk/Blynk@^1.3.2
    knolleary/PubSubClient@^2.8
    mandulaj/PZEM-004T-v30@^1.1.2
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra

[env:esp32dev_sim]
build_flags =
    ${env.build_flags}
    -DENERGY_SOURCE_SIMULATION

[env:esp32dev_pzem]
build_flags =
    ${env.build_flags}
    -DENERGY_SOURCE_PZEM
