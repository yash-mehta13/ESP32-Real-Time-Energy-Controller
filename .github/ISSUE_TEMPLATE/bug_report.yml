name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste Wi-Fi, MQTT or Blynk credentials. Mains work is dangerous:
        do not describe or request live-mains wiring steps here.
  - type: input
    id: version
    attributes:
      label: Firmware version and commit
      placeholder: "1.3.0 / git rev-parse HEAD"
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Build environment
      options: [esp32dev_sim, esp32dev_pzem, host tests (make test)]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Serial output (`status`, `fault`, `watchdog`) with credentials removed
      render: text
  - type: textarea
    id: hardware
    attributes:
      label: Hardware (if relevant)
      description: Board, relay module and verified polarity, PZEM variant, load type (no wiring instructions needed).
  - type: checkboxes
    id: evidence
    attributes:
      label: Evidence level
      options:
        - label: Reproduced in simulation / host tests
        - label: Observed on hardware (describe above)
