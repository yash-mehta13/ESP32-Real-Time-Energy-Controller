<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 706" width="1180" height="706" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" role="img" aria-labelledby="t d"><title id="t">System architecture</title><desc id="d">Measurement source feeds SensorTask, a queue, and ControlTask with the protection state machine and actuator. NetworkTask handles Blynk and MQTT/TLS separately. WatchdogTask and CliTask supervise and inspect. Simulation builds cannot drive the relay pin.</desc><defs><marker id="ah4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ah374151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah6d28d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker></defs><rect width="1180" height="706" fill="#ffffff"/><text x="24" y="36" font-size="20" font-weight="bold" text-anchor="start" fill="#111827" >ESP32 Real-Time Energy Controller — system architecture</text>
<text x="24" y="58" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" >Local protection path (blue) is independent of the network path (orange). Source: src/main.cpp, lib/energy_core.</text>
<rect x="24" y="100" width="210" height="78" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="129.0" y="123.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >PZEM-004T v3.0</text>
<text x="129.0" y="141.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >UART2 9600 baud, GPIO16/17</text>
<text x="129.0" y="159.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >build: esp32dev_pzem</text>
<rect x="24" y="214" width="210" height="78" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4"/>
<text x="129.0" y="237.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >Simulation source</text>
<text x="129.0" y="255.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >deterministic 15 s profile</text>
<text x="129.0" y="273.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >build: esp32dev_sim (default)</text>
<rect x="290" y="150" width="150" height="86" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="365.0" y="177.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >SensorTask</text>
<text x="365.0" y="195.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >1 s period, core 1</text>
<text x="365.0" y="213.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >validate + derive VA</text>
<polyline points="234,139 262,139 262,180 290,180" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ah15803d)"/>
<polyline points="234,253 262,253 262,206 290,206" fill="none" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah4b5563)"/>
<rect x="470" y="164" width="140" height="58" rx="4" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<text x="540.0" y="186.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827" >measurementQueue</text>
<text x="540.0" y="204.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >5 x Measurement</text>
<polyline points="440,193 470,193" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<rect x="650" y="120" width="260" height="190" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="780.0" y="172.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >ControlTask</text>
<text x="780.0" y="190.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >100 ms loop, core 1, prio 4</text>
<text x="780.0" y="208.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >ProtectionCore state machine</text>
<text x="780.0" y="226.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >INIT / NORMAL / WARNING / FAULT</text>
<text x="780.0" y="244.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >freshness, latch, reset interlock</text>
<text x="780.0" y="262.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >tick() detects sensor silence</text>
<polyline points="610,193 650,193" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<rect x="960" y="120" width="196" height="86" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1058.0" y="147.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >Actuator module</text>
<text x="1058.0" y="165.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >only writer of relay/LED GPIO</text>
<text x="1058.0" y="183.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >outputsForResult() every cycle</text>
<polyline points="910,163 960,163" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahb91c1c)"/>
<rect x="960" y="240" width="196" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1058.0" y="259.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#111827" >Relay GPIO23 + LEDs</text>
<text x="1058.0" y="277.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >hardware build: follows state</text>
<text x="1058.0" y="295.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >sim build: relay pin held OFF</text>
<polyline points="1058,206 1058,240" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahb91c1c)"/>
<g stroke="#b91c1c" stroke-width="3"><line x1="320" y1="337" x2="338" y2="355"/><line x1="338" y1="337" x2="320" y2="355"/></g>
<text x="350" y="351" font-size="12" font-weight="bold" text-anchor="start" fill="#b91c1c" >Simulated values never close the relay pin (RelayOutputMode::HOLD_OFF)</text>
<rect x="470" y="262" width="140" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="540.0" y="281.0" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827" >DisplayTask</text>
<text x="540.0" y="299.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >reads snapshots, 500 ms</text>
<polyline points="650,288 610,288" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<text x="24" y="392" font-size="14" font-weight="bold" text-anchor="start" fill="#c2410c" >Network path - never required for local protection</text>
<rect x="290" y="410" width="220" height="150" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="400.0" y="451.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >NetworkTask</text>
<text x="400.0" y="469.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >10 ms loop, core 0</text>
<text x="400.0" y="487.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >Wi-Fi, NTP, reconnects</text>
<text x="400.0" y="505.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >MQTT callback only validates</text>
<text x="400.0" y="523.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >and enqueues; no GPIO access</text>
<rect x="610" y="410" width="200" height="50" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="710.0" y="428.0" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827" >Blynk cloud</text>
<text x="710.0" y="446.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >virtual pins V0-V5</text>
<rect x="610" y="490" width="200" height="66" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="710.0" y="507.0" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#111827" >HiveMQ Cloud</text>
<text x="710.0" y="525.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >MQTT over TLS :8883</text>
<text x="710.0" y="543.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >CA-verified, ACL per device</text>
<polyline points="510,435 610,435" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ahc2410c)"/>
<polyline points="510,508 610,508" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ahc2410c)"/>
<text x="560" y="501" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#c2410c" >telemetry v2</text>
<polyline points="610,538 510,538" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ahc2410c)"/>
<text x="560" y="553" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#c2410c" >cmd topics</text>
<rect x="850" y="440" width="170" height="56" rx="4" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<text x="935.0" y="461.0" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827" >commandQueue</text>
<text x="935.0" y="479.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >8 x command, no wait</text>
<polyline points="400,560 400,592 935,592 935,496" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahc2410c)"/>
<text x="668" y="586" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#c2410c" >validated remote reset / ack only</text>
<polyline points="880,440 880,310" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<text x="890" y="380" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1d4ed8" >drained by ControlTask</text>
<text x="24" y="624" font-size="14" font-weight="bold" text-anchor="start" fill="#6d28d9" >Supervision and diagnostics</text>
<rect x="24" y="636" width="250" height="54" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="149.0" y="656.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" >WatchdogTask (core 0, prio 5)</text>
<text x="149.0" y="674.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >heartbeats + safe output before restart</text>
<rect x="300" y="636" width="210" height="54" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="405.0" y="656.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" >CliTask (serial 115200)</text>
<text x="405.0" y="674.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >status · fault · reset · ack</text>
<rect x="536" y="636" width="250" height="54" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="661.0" y="656.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" >ESP-IDF task watchdog (8 s)</text>
<text x="661.0" y="674.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >hardware-backed reset on stall</text>
<text x="810" y="662" font-size="11.5" font-weight="normal" text-anchor="start" fill="#4b5563" >Application heartbeats: all six tasks</text>
<text x="1156" y="690" font-size="11" font-weight="normal" text-anchor="end" fill="#6b7280" >Conceptual diagram derived from the source; not a hardware schematic.</text></svg>
