<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" role="img" aria-labelledby="t d"><title id="t">Measurement pipeline</title><desc id="d">PZEM raw values pass finite, range, derived-value and consistency checks into a Measurement, then the queue, freshness check and protection logic. Latest measurement also feeds display and telemetry.</desc><defs><marker id="ah4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ah374151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah6d28d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs><rect width="1180" height="470" fill="#ffffff"/><text x="24" y="36" font-size="20" font-weight="bold" text-anchor="start" fill="#111827" >Measurement pipeline</text>
<text x="24" y="58" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" >lib/energy_core/src/measurement_core.cpp, src/measurement.cpp. Invalid samples are never converted into zero readings.</text>
<rect x="24" y="100" width="176" height="120" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="112.0" y="144.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >PZEM-004T v3.0</text>
<text x="112.0" y="162.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >V, I, P, E, PF</text>
<text x="112.0" y="180.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >NaN when meter silent</text>
<rect x="230" y="100" width="176" height="120" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="318.0" y="144.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >Finite check</text>
<text x="318.0" y="162.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >NaN / Inf in any field</text>
<text x="318.0" y="180.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >-&gt; SENSOR_ERROR</text>
<rect x="436" y="100" width="176" height="120" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="524.0" y="135.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >Range check</text>
<text x="524.0" y="153.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >negative or above</text>
<text x="524.0" y="171.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >plausibility bound</text>
<text x="524.0" y="189.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >-&gt; OUT_OF_RANGE</text>
<rect x="642" y="100" width="176" height="120" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="730.0" y="135.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >Derive + consistency</text>
<text x="730.0" y="153.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >S = V x I (VA)</text>
<text x="730.0" y="171.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >P &gt; 1.1 S + 2 W</text>
<text x="730.0" y="189.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >-&gt; INCONSISTENT</text>
<rect x="848" y="100" width="176" height="120" rx="8" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<text x="936.0" y="144.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >Measurement</text>
<text x="936.0" y="162.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >valid, status, source</text>
<text x="936.0" y="180.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >timestamp = millis()</text>
<polyline points="200,160 230,160" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<polyline points="406,160 436,160" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<polyline points="612,160 642,160" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<polyline points="818,160 848,160" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<rect x="848" y="280" width="176" height="70" rx="4" fill="#ffffff" stroke="#374151" stroke-width="2"/>
<text x="936.0" y="308.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" >measurementQueue</text>
<text x="936.0" y="326.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >to ControlTask</text>
<polyline points="936,220 936,280" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<rect x="642" y="280" width="176" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="730.0" y="308.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" >Freshness &lt;= 3 s</text>
<text x="730.0" y="326.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >else SENSOR_STALE</text>
<polyline points="848,315 818,315" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<rect x="436" y="280" width="176" height="70" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="524.0" y="308.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" >ProtectionCore</text>
<text x="524.0" y="326.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >state + fault latch</text>
<polyline points="642,315 612,315" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<rect x="230" y="280" width="176" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="318.0" y="308.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" >Actuator</text>
<text x="318.0" y="326.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >relay + LEDs</text>
<polyline points="436,315 406,315" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahb91c1c)"/>
<rect x="24" y="396" width="400" height="56" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="224.0" y="417.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#111827" >latestMeasurement (mutex copy)</text>
<text x="224.0" y="435.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >LCD, CLI, Blynk V0-V5, MQTT telemetry</text>
<polyline points="1024,160 1060,160 1060,424 424,424" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ahc2410c)"/>
<text x="740" y="410" font-size="11.5" font-weight="normal" text-anchor="start" fill="#c2410c" >same sample copied for reporting only (dashed)</text>
<text x="24" y="382" font-size="12" font-weight="normal" text-anchor="start" fill="#374151" >Units: V, A, W (meter active power), kWh (meter accumulator), VA (derived), PF 0-1.</text>
<text x="450" y="440" font-size="12" font-weight="bold" text-anchor="start" fill="#374151" >Active power is the meter value, never V x I. Limits are sanity bounds, not calibration data.</text>
<text x="1156" y="460" font-size="11" font-weight="normal" text-anchor="end" fill="#6b7280" >Conceptual diagram derived from the source.</text></svg>
