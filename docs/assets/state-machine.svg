<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="Helvetica, Arial, DejaVu Sans, sans-serif" role="img" aria-labelledby="t d"><title id="t">Protection state machine</title><desc id="d">States INIT, NORMAL, WARNING and FAULT with the conditions for each transition, the latch, acknowledge and reset interlock.</desc><defs><marker id="ah4b5563" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker><marker id="ah374151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ah6d28d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker><marker id="ahc2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><marker id="ahb91c1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker><marker id="ah1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs><rect width="1180" height="640" fill="#ffffff"/><text x="24" y="36" font-size="20" font-weight="bold" text-anchor="start" fill="#111827" >Protection state machine</text>
<text x="24" y="58" font-size="12.5" font-weight="normal" text-anchor="start" fill="#4b5563" >Defaults: warning &gt; 485 W, fault &gt; 550 W confirmed for 2000 ms, measurement freshness 3000 ms (lib/energy_core/src/protection_core.cpp).</text>
<rect x="60" y="150" width="200" height="90" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="160.0" y="179.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >INIT</text>
<text x="160.0" y="197.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >relay OFF, LEDs off</text>
<text x="160.0" y="215.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >start-up, no mains, after reset</text>
<rect x="430" y="100" width="200" height="90" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="530.0" y="129.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >NORMAL</text>
<text x="530.0" y="147.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >relay ON, green LED</text>
<text x="530.0" y="165.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >P &lt;= 485 W</text>
<rect x="430" y="290" width="200" height="90" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="530.0" y="319.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >WARNING</text>
<text x="530.0" y="337.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >relay ON, red LED</text>
<text x="530.0" y="355.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >485 W &lt; P, or P &gt; 550 W &lt; 2 s</text>
<rect x="810" y="180" width="346" height="120" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="983.0" y="215.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#111827" >FAULT (latched)</text>
<text x="983.0" y="233.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >relay OFF, red LED</text>
<text x="983.0" y="251.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >OVERPOWER, SENSOR_INVALID,</text>
<text x="983.0" y="269.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#374151" >SENSOR_STALE, PROTECTION_INTERNAL</text>
<polyline points="260,175 430,145" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ah15803d)"/>
<text x="345" y="132" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#15803d" >fresh valid, V &gt; 10 V,</text>
<text x="345" y="146" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#15803d" >P &lt;= 485 W</text>
<polyline points="260,215 430,335" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<text x="318" y="300" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d4ed8" >fresh valid, P &gt; 485 W</text>
<polyline points="490,190 490,290" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ah1d4ed8)"/>
<text x="482" y="244" font-size="11.5" font-weight="normal" text-anchor="end" fill="#1d4ed8" >P &gt; 485 W</text>
<polyline points="570,290 570,190" fill="none" stroke="#15803d" stroke-width="2" marker-end="url(#ah15803d)"/>
<text x="578" y="244" font-size="11.5" font-weight="normal" text-anchor="start" fill="#15803d" >P &lt;= 485 W</text>
<polyline points="630,140 810,205" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahb91c1c)"/>
<text x="720" y="156" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#b91c1c" >invalid / stale / internal</text>
<polyline points="630,340 810,275" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#ahb91c1c)"/>
<text x="720" y="332" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#b91c1c" >P &gt; 550 W for &gt;= 2 s</text>
<polyline points="983,300 983,430 160,430 160,240" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah6b7280)"/>
<text x="570" y="422" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#4b5563" >reset accepted -&gt; INIT (relay stays OFF)</text>
<text x="570" y="448" font-size="12" font-weight="normal" text-anchor="middle" fill="#4b5563" >accepted only if a fresh, valid sample shows P &lt;= 550 W; ACK never leaves FAULT</text>
<text x="24" y="486" font-size="15" font-weight="bold" text-anchor="start" fill="#111827" >Rules</text>
<text x="36" y="510" font-size="12.5" font-weight="normal" text-anchor="start" fill="#374151" >• FAULT is latched: a good sample, ACK or a network event never clears it. Only an accepted reset leaves FAULT.</text>
<text x="36" y="530" font-size="12.5" font-weight="normal" text-anchor="start" fill="#374151" >• ACK sets the acknowledged flag only. It does not change the state or the relay.</text>
<text x="36" y="550" font-size="12.5" font-weight="normal" text-anchor="start" fill="#374151" >• After boot or an accepted reset the first sample may not open a confirmation window: P &gt; 550 W re-latches OVERPOWER immediately.</text>
<text x="36" y="570" font-size="12.5" font-weight="normal" text-anchor="start" fill="#374151" >• No usable sample for 3 s (tick) latches SENSOR_STALE. A failed protection lock latches PROTECTION_INTERNAL and forces the safe output.</text>
<text x="36" y="590" font-size="12.5" font-weight="normal" text-anchor="start" fill="#374151" >• V &lt;= 10 V from any run state goes to INIT (relay OFF); mains returning onto an overload latches immediately.</text>
<text x="1156" y="630" font-size="11" font-weight="normal" text-anchor="end" fill="#6b7280" >Conceptual diagram derived from the source and host tests.</text></svg>
